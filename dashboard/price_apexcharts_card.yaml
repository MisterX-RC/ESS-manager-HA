# Adapted from the original hand-written template-sensor dashboard.
#
# Unlike the original, this card reads price data straight off
# sensor.ess_manager_status's own all_price/current_price_unit/
# today_price_units attributes - it already imported the price data from
# your Nordpool (or similar) sensor during its own update cycle, so there's
# no need to separately reference that sensor here too. Before pasting into
# Lovelace, just replace:
#   sensor.ess_manager_status   -> your actual main status sensor's entity_id

- type: "vertical-stack"
  cards:
  - type: custom:apexcharts-card
    now:
      show: true
      label: NOW
    graph_span: 48h
    apex_config:
      chart:
        height: 200px
        stacked: true
      legend:
        showForSingleSeries: true
      plotOptions:
        bar:
          borderRadius: 2
      yaxis:
        decimalsInFloat: 2
        tickAmount: 10
        forceNiceScale: false
      xaxis:
        labels:
          datetimeFormatter:
            hour: HH
    all_series_config:
      show:
        offset_in_name: false
    header:
      title: " "
      show: true
      show_states: true
      colorize_states: true
    span:
      start: day
      offset: +0h
    series:
      - entity: sensor.ess_manager_status
        type: line
        color: transparent
        stroke_width: 0
        name: " "
        show:
          in_header: false
          in_legend: false
          legend_value: false
        data_generator: |
          const attrs = entity.attributes;
          const allPrice = attrs.all_price || [];
          if (allPrice.length === 0) return [];
          const curUnit = attrs.current_price_unit || 0;
          const nowMs = Date.now();
          const top = Math.max(...allPrice) + 0.05;
          const firstT = nowMs + (0 - curUnit) * 15 * 60000;
          const lastT = nowMs + (allPrice.length - 1 - curUnit) * 15 * 60000;
          return [[firstT, top], [lastT, top]];
      - entity: sensor.ess_manager_status
        type: column
        color: '#2196F3'
        float_precision: 4
        stroke_width: 2
        name: Buy
        show:
          in_header: false
          legend_value: false
          extremas: min
        data_generator: |
          const attrs = entity.attributes;
          const allPrice = attrs.all_price || [];
          const curUnit = attrs.current_price_unit || 0;
          const nowMs = Date.now();
          const full = attrs['full_charge_plan'];
          const neg = attrs['negative_price_plan'];
          const spike = attrs['spike_plan'];
          const plan = attrs['low_charge_plan'];
          let startUnit = null, endUnit = null;
          if (full && full.active && (full.phase === 'scheduled' || full.phase === 'charging')) {
            startUnit = full.start_unit; endUnit = full.end_unit;
          } else if (neg && neg.active) {
            startUnit = neg.charge_start_unit; endUnit = neg.charge_end_unit;
          } else if (spike && spike.active) {
            startUnit = spike.charge_start_unit; endUnit = spike.charge_end_unit;
          } else if (plan && plan.active) {
            startUnit = plan.start_unit; endUnit = plan.end_unit;
          }
          return allPrice.map((value, i) => {
            const t = nowMs + (i - curUnit) * 15 * 60000;
            const inWindow = startUnit !== null && i >= startUnit && i < endUnit;
            return [t, inWindow ? value : null];
          });
      - entity: sensor.ess_manager_status
        type: column
        color: '#FF5252'
        float_precision: 4
        stroke_width: 2
        name: Sell
        show:
          in_header: false
          legend_value: false
          extremas: max
        data_generator: |
          const attrs = entity.attributes;
          const allPrice = attrs.all_price || [];
          const curUnit = attrs.current_price_unit || 0;
          const nowMs = Date.now();
          const neg = attrs['negative_price_plan'];
          const spike = attrs['spike_plan'];
          const plan = attrs['high_discharge_plan'];
          let startUnit = null, endUnit = null;
          if (neg && neg.active) {
            startUnit = neg.discharge_start_unit; endUnit = neg.discharge_end_unit;
          } else if (spike && spike.active) {
            startUnit = spike.discharge_start_unit; endUnit = spike.discharge_end_unit;
          } else if (plan && plan.active) {
            startUnit = plan.start_unit; endUnit = plan.end_unit;
          }
          return allPrice.map((value, i) => {
            const t = nowMs + (i - curUnit) * 15 * 60000;
            const inWindow = startUnit !== null && i >= startUnit && i < endUnit;
            return [t, inWindow ? value : null];
          });
      - entity: sensor.ess_manager_status
        type: column
        color: '#00BCD4'
        float_precision: 4
        stroke_width: 2
        name: Solar export
        show:
          in_header: false
          legend_value: false
        data_generator: |
          const attrs = entity.attributes;
          const allPrice = attrs.all_price || [];
          const curUnit = attrs.current_price_unit || 0;
          const nowMs = Date.now();
          const neg = attrs['negative_price_plan'];
          let startUnit = null, endUnit = null;
          if (neg && neg.active && neg.solar_export_end_unit > neg.solar_export_start_unit) {
            startUnit = neg.solar_export_start_unit; endUnit = neg.solar_export_end_unit;
          }
          return allPrice.map((value, i) => {
            const t = nowMs + (i - curUnit) * 15 * 60000;
            const inWindow = startUnit !== null && i >= startUnit && i < endUnit;
            return [t, inWindow ? value : null];
          });
      - entity: sensor.ess_manager_status
        type: line
        color: transparent
        stroke_width: 0
        float_precision: 2
        name: " "
        show:
          in_header: false
          in_legend: false
          legend_value: false
          extremas: true
        data_generator: |
          const attrs = entity.attributes;
          const allPrice = attrs.all_price || [];
          const curUnit = attrs.current_price_unit || 0;
          const todayUnits = attrs.today_price_units !== undefined ? attrs.today_price_units : 96;
          const nowMs = Date.now();
          return allPrice.map((value, i) => {
            const t = nowMs + (i - curUnit) * 15 * 60000;
            return [t, i < todayUnits ? value : null];
          });
      - entity: sensor.ess_manager_status
        type: line
        color: transparent
        stroke_width: 0
        float_precision: 2
        name: " "
        show:
          in_header: false
          in_legend: false
          legend_value: false
          extremas: true
        data_generator: |
          const attrs = entity.attributes;
          const allPrice = attrs.all_price || [];
          const curUnit = attrs.current_price_unit || 0;
          const todayUnits = attrs.today_price_units !== undefined ? attrs.today_price_units : 96;
          const nowMs = Date.now();
          return allPrice.map((value, i) => {
            const t = nowMs + (i - curUnit) * 15 * 60000;
            return [t, i >= todayUnits ? value : null];
          });
      - entity: sensor.ess_manager_status
        type: column
        color: green
        float_precision: 4
        stroke_width: 2
        name: Today's prices
        show:
          in_header: false
          legend_value: false
        data_generator: |
          const attrs = entity.attributes;
          const allPrice = attrs.all_price || [];
          const curUnit = attrs.current_price_unit || 0;
          const todayUnits = attrs.today_price_units !== undefined ? attrs.today_price_units : 96;
          const nowMs = Date.now();
          const full = attrs['full_charge_plan'];
          const neg = attrs['negative_price_plan'];
          const spike = attrs['spike_plan'];
          const buy = attrs['low_charge_plan'];
          const sell = attrs['high_discharge_plan'];
          const fullOn = full && full.active && (full.phase === 'scheduled' || full.phase === 'charging');
          const negOn = !fullOn && neg && neg.active;
          const spikeOn = !fullOn && !negOn && spike && spike.active;
          const buyStart = fullOn ? full.start_unit : (negOn ? neg.charge_start_unit : (spikeOn ? spike.charge_start_unit : (buy && buy.active ? buy.start_unit : null)));
          const buyEnd = fullOn ? full.end_unit : (negOn ? neg.charge_end_unit : (spikeOn ? spike.charge_end_unit : (buy && buy.active ? buy.end_unit : null)));
          const sellStart = negOn ? neg.discharge_start_unit : (spikeOn ? spike.discharge_start_unit : (sell && sell.active ? sell.start_unit : null));
          const sellEnd = negOn ? neg.discharge_end_unit : (spikeOn ? spike.discharge_end_unit : (sell && sell.active ? sell.end_unit : null));
          const exportStart = (negOn && neg.solar_export_end_unit > neg.solar_export_start_unit) ? neg.solar_export_start_unit : null;
          const exportEnd = (negOn && neg.solar_export_end_unit > neg.solar_export_start_unit) ? neg.solar_export_end_unit : null;
          return allPrice.map((value, i) => {
            const t = nowMs + (i - curUnit) * 15 * 60000;
            if (i >= todayUnits) return [t, null];
            const inBuy = buyStart !== null && i >= buyStart && i < buyEnd;
            const inSell = sellStart !== null && i >= sellStart && i < sellEnd;
            const inExport = exportStart !== null && i >= exportStart && i < exportEnd;
            return [t, (inBuy || inSell || inExport) ? null : value];
          });
      - entity: sensor.ess_manager_status
        type: column
        color: yellow
        float_precision: 4
        stroke_width: 2
        name: Tomorrow's prices
        show:
          in_header: false
          legend_value: false
        data_generator: |
          const attrs = entity.attributes;
          const allPrice = attrs.all_price || [];
          const curUnit = attrs.current_price_unit || 0;
          const todayUnits = attrs.today_price_units !== undefined ? attrs.today_price_units : 96;
          const nowMs = Date.now();
          const full = attrs['full_charge_plan'];
          const neg = attrs['negative_price_plan'];
          const spike = attrs['spike_plan'];
          const buy = attrs['low_charge_plan'];
          const sell = attrs['high_discharge_plan'];
          const fullOn = full && full.active && (full.phase === 'scheduled' || full.phase === 'charging');
          const negOn = !fullOn && neg && neg.active;
          const spikeOn = !fullOn && !negOn && spike && spike.active;
          const buyStart = fullOn ? full.start_unit : (negOn ? neg.charge_start_unit : (spikeOn ? spike.charge_start_unit : (buy && buy.active ? buy.start_unit : null)));
          const buyEnd = fullOn ? full.end_unit : (negOn ? neg.charge_end_unit : (spikeOn ? spike.charge_end_unit : (buy && buy.active ? buy.end_unit : null)));
          const sellStart = negOn ? neg.discharge_start_unit : (spikeOn ? spike.discharge_start_unit : (sell && sell.active ? sell.start_unit : null));
          const sellEnd = negOn ? neg.discharge_end_unit : (spikeOn ? spike.discharge_end_unit : (sell && sell.active ? sell.end_unit : null));
          const exportStart = (negOn && neg.solar_export_end_unit > neg.solar_export_start_unit) ? neg.solar_export_start_unit : null;
          const exportEnd = (negOn && neg.solar_export_end_unit > neg.solar_export_start_unit) ? neg.solar_export_end_unit : null;
          return allPrice.map((value, i) => {
            const t = nowMs + (i - curUnit) * 15 * 60000;
            if (i < todayUnits) return [t, null];
            const inBuy = buyStart !== null && i >= buyStart && i < buyEnd;
            const inSell = sellStart !== null && i >= sellStart && i < sellEnd;
            const inExport = exportStart !== null && i >= exportStart && i < exportEnd;
            return [t, (inBuy || inSell || inExport) ? null : value];
          });
