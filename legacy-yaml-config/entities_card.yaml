type: custom:stack-in-card
mode: vertical
cards:
  - type: entities
    entities:
      - type: custom:multiple-entity-row
        entity: sensor.ess_manager
        name: Charge
        icon: mdi:battery-charging
        show_state: false
        entities:
          - attribute: system_status
            name: Status
          - attribute: charge start time
            name: Start
          - attribute: charge energy kwh
            name: Amount
          - attribute: charge stop time
            name: Stop

      - type: custom:multiple-entity-row
        entity: sensor.ess_manager
        name: Discharge
        icon: mdi:battery-arrow-down
        show_state: false
        entities:
          - attribute: discharge start time
            name: Start
          - attribute: discharge energy kwh
            name: Amount
          - attribute: discharge stop time
            name: Stop

  - type: history-graph
    entities:
      - entity: sensor.ess_manager
