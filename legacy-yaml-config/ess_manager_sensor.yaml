          {% set plan = this.attributes['high discharge plan'] %}
          {% if neg and neg.active and cur < neg.discharge_end_unit and neg.discharge_needed_kwh > 0 %}
            {{ neg.discharge_needed_kwh | round(2) }} kWh
          {% elif spike and spike.active and cur < spike.discharge_end_unit %}
            {{ spike.discharge_target_kwh | round(2) }} kWh
          {% elif plan and plan.active %}
            {{ plan.target_kwh | round(2) }} kWh
          {% else %}
            -
          {% endif %}

        discharge start time: >
          {% set neg = this.attributes['negative price plan'] %}
          {% set spike = this.attributes['spike plan'] %}
          {% set cur = this.attributes['current price unit'] | int(0) %}
          {% set plan = this.attributes['high discharge plan'] %}
          {% if neg and neg.active and cur < neg.discharge_end_unit and neg.discharge_needed_kwh > 0 %}
            {% set offset_units = neg.discharge_start_unit - cur %}
            {{ (now() + timedelta(minutes=offset_units * 15)).strftime('%a %H:%M') }}
          {% elif spike and spike.active and cur < spike.discharge_end_unit %}
            {% set offset_units = spike.discharge_start_unit - cur %}
            {{ (now() + timedelta(minutes=offset_units * 15)).strftime('%a %H:%M') }}
          {% elif plan and plan.active %}
            {% set offset_units = plan.start_unit - cur %}
            {{ (now() + timedelta(minutes=offset_units * 15)).strftime('%a %H:%M') }}
          {% else %}
            -
          {% endif %}

        discharge stop time: >
          {% set neg = this.attributes['negative price plan'] %}
          {% set spike = this.attributes['spike plan'] %}
          {% set cur = this.attributes['current price unit'] | int(0) %}
          {% set plan = this.attributes['high discharge plan'] %}
          {% if neg and neg.active and cur < neg.discharge_end_unit and neg.discharge_needed_kwh > 0 %}
            {% set offset_units = neg.discharge_end_unit - cur %}
            {{ (now() + timedelta(minutes=offset_units * 15)).strftime('%a %H:%M') }}
          {% elif spike and spike.active and cur < spike.discharge_end_unit %}
            {% set offset_units = spike.discharge_end_unit - cur %}
            {{ (now() + timedelta(minutes=offset_units * 15)).strftime('%a %H:%M') }}
          {% elif plan and plan.active %}
            {% set offset_units = plan.end_unit - cur %}
            {{ (now() + timedelta(minutes=offset_units * 15)).strftime('%a %H:%M') }}
          {% else %}
            -
          {% endif %}

        spike status: >
          {% set spike = this.attributes['spike plan'] %}
          {% if spike and spike.active %}
            Active (€{{ spike.day_min_price }} → €{{ spike.day_max_price }})
          {% else %}
            Inactive
          {% endif %}

        spike price floor: >
          {% set spike = this.attributes['spike plan'] %}
          {{ ('€' ~ spike.discharge_price_floor) if (spike and spike.active) else '-' }}

        spike capped: >
          {% set spike = this.attributes['spike plan'] %}
          {{ ('Yes' if spike.discharge_capped_by_price else 'No') if (spike and spike.active) else '-' }}

        battery level kwh: >
          {{ this.attributes['battery energy'] | round(1) }} kWh

        next full charge in days: >
          {% set interval = this.attributes['full charge interval days'] | float(14) %}
          {% set since = this.attributes['time since full charge days'] | float(0) %}
          {{ [(interval - since), 0] | max | round(1) }}
