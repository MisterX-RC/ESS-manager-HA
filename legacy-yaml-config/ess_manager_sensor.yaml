- triggers:
    - trigger: time_pattern
      #      minutes: "/1"
      seconds: "/30"

  sensor:
    - name: "ESS manager"
      unique_id: ESS_manager_nieuw
      state: >
        {{ this.attributes.system_status | default('Error!') }}

      attributes:
        battery_charge_speed: "{{ 7 }}"
        battery_discharge_speed: "{{ 10 }}"
        negative price threshold: "{{ -0.20 }}"
        negative price charge speed: "{{ 15 }}"
        spike discharge speed: "{{ 15 }}"
        grid usage lookahead units: "{{ 4 }}"
        minimum charge target kwh: "{{ 5 }}"
        full charge interval days: "{{ 14 }}"
        full charge max hold minutes: "{{ 120 }}"
        planning horizon hours: "{{ 72 }}"
        today_price: "{{ states.sensor.nordpool_kwh_nl_eur_3_10_0.attributes.today }}"
        tomorrow_price: "{{ states.sensor.nordpool_kwh_nl_eur_3_10_0.attributes.tomorrow }}"
        all_price: "{{ this.attributes.today_price + this.attributes.tomorrow_price }}"

        low threshold kwh: >
          {% set min_soc = states('sensor.victron_cerbo_gx_minimum_soc') | float(0) %}
          {% set capacity = 30 %}
          {{ (((min_soc + 5) / 100) * capacity) | round(2) }}

        time since full charge days: >
          {{ states('sensor.victron_shunt_time_sinds_last_full_charge') | float(0) | round(2) }}

        solar 120 hrs: >
            {# Extended from 51 to 121 hours (2026-09-11) to match the new 5-day usage forecast horizon --
               today/tomorrow/day_3 alone can fall short of 120 hours depending on time of day (e.g. late
               in the day, today only contributes its remaining hour or two), so day_4/day_5 (and now day_6,
               added 2026-09-11) are chained as the buffer that guarantees full coverage regardless of when
               in the day this renders -- day_6 covers the case where day_4/day_5 alone still run short late
               in the day, since each Solcast day sensor's own coverage shrinks as the day progresses. #}
            {% set today = state_attr('sensor.solcast_pv_forecast_forecast_today', 'detailedHourly') or [] %}
            {% set tomorrow = state_attr('sensor.solcast_pv_forecast_forecast_tomorrow', 'detailedHourly') or [] %}
            {% set day3 = state_attr('sensor.solcast_pv_forecast_forecast_day_3', 'detailedHourly') or [] %}
            {% set day4 = state_attr('sensor.solcast_pv_forecast_forecast_day_4', 'detailedHourly') or [] %}
            {% set day5 = state_attr('sensor.solcast_pv_forecast_forecast_day_5', 'detailedHourly') or [] %}
            {% set day6 = state_attr('sensor.solcast_pv_forecast_forecast_day_6', 'detailedHourly') or [] %}
            {% set hourly = today + tomorrow + day3 + day4 + day5 + day6 %}
            {% set ns = namespace(values=[]) %}
            {% for h in range(0, 121) %}
              {% set target = (now() + timedelta(hours=h)).replace(minute=0, second=0, microsecond=0) %}
              {% set inner_ns = namespace(value=none) %}
              {% for i in hourly %}
                {% if as_datetime(i.period_start) == target %}
                  {% set inner_ns.value = i.pv_estimate %}
                {% endif %}
              {% endfor %}
              {% set ns.values = ns.values + [inner_ns.value] %}
            {% endfor %}
            {{ ns.values }}

        energy usage 120 hrs: >
          {# Reads the consolidated sensor.predicted_energy_forecast (one SQL sensor computing all 121
             hours in a single query, refreshed once per hour by its own automation) instead of 51
             separate sensor.predicted_energy_hour_N entities -- see "Household Usage Prediction Sensors"
             for why: the old per-hour-sensor design polled a heavy multi-join query every 30 seconds x
             51 sensors with no way to throttle it once defined outside the GUI. Extended from 51 to 121
             hours (2026-09-11) to match the sensor's now-121-hour data range. #}
          {% set forecast_entity = 'sensor.predicted_energy_forecast' %}
          {% set ns = namespace(values=[]) %}
          {% for h in range(0, 121) %}
            {% set value = state_attr(forecast_entity, 'h' ~ h) %}
            {% set safe_value = value | float(0) if value is not none else 0 %}
            {% set ns.values = ns.values + [safe_value] %}
          {% endfor %}
          {{ ns.values }}

        net energy 120 hrs: >
          {# Previously looped range(0, 50) even though solar/usage were 51 elements long -- a harmless
             off-by-one that just dropped the very last hour. Fixed while extending (2026-09-11): now
             matches solar/usage's own length exactly (121 elements) instead of hardcoding a count. #}
          {% set solar = this.attributes['solar 120 hrs'] or [] %}
          {% set usage = this.attributes['energy usage 120 hrs'] or [] %}
          {% set ns = namespace(values=[]) %}
          {% for h in range(0, solar | length) %}
            {% set solar_val = solar[h] | float(0) if solar[h] is not none else 0 %}
            {% set usage_val = usage[h] | float(0) if h < usage | length else 0 %}
            {% set ns.values = ns.values + [(solar_val - usage_val) | round(3)] %}
          {% endfor %}
          {{ ns.values }}

        battery energy: >
          {% set soc = states('sensor.victron_shunt_state_of_charge') | int %}
          {% set capa = 30 %}
            {{ (capa*(soc/100)) |round(2) }}

        battery forecast: >
          {# net[0] represents the FULL current calendar hour (top-of-hour to top-of-next-hour), but
             "battery energy" is a live reading taken mid-hour -- summing them as-is applies a full hour's
             worth of change over whatever fraction of the hour is actually still left, double-counting
             whatever already happened between the top of the hour and now. Scale just the h=0 contribution
             by the fraction of the hour still remaining so the first cumulative step only predicts what's
             left, not a full hour crammed into less real time (2026-09-14). This is a simple time-fraction
             approximation -- reasonable for usage, imperfect for solar specifically since a single hourly
             Solcast value carries no information about whether generation is front- or back-loaded within
             that hour, but still a clear improvement over not compensating at all. Every hour after 0 is
             already a genuine full hour ahead, so it's left untouched. #}
          {% set net = this.attributes['net energy 120 hrs'] or [] %}
          {% set start = this.attributes['battery energy'] | float(0) %}
          {% set fraction_remaining = (60 - now().minute) / 60 %}
          {% set ns = namespace(values=[], soc=start) %}
          {% for h in range(0, net | length) %}
            {% set delta = (net[h] * fraction_remaining) if h == 0 else net[h] %}
            {% set ns.soc = ns.soc + delta %}
            {% set ns.values = ns.values + [ns.soc | round(2)] %}
          {% endfor %}
          {{ ns.values }}

        battery forecast lowest point units: >
          {% set forecast = this.attributes['battery forecast'] or [] %}
          {% set low_threshold = this.attributes['low threshold kwh'] | float(3) %}
          {% set ns = namespace(found=false, index=0) %}
          {% for h in range(0, forecast | length) %}
            {% if not ns.found and forecast[h] < low_threshold %}
              {% set ns.found = true %}
              {% set ns.index = h %}
            {% endif %}
          {% endfor %}
          {% if ns.found %}
            {% set current_unit = (now().minute // 15) | int %}
            {% set units_remaining_this_hour = 4 - current_unit %}
            {{ units_remaining_this_hour + (ns.index * 4) }}
          {% else %}
            0
          {% endif %}

        battery forecast highest point units: >
          {% set forecast = this.attributes['battery forecast'] or [] %}
          {% set ns = namespace(found=false, index=0) %}
          {% for h in range(0, forecast | length) %}
            {% if not ns.found and forecast[h] > 33 %}
              {% set ns.found = true %}
              {% set ns.index = h %}
            {% endif %}
          {% endfor %}
          {% if ns.found %}
            {% set current_unit = (now().minute // 15) | int %}
            {% set units_remaining_this_hour = 4 - current_unit %}
            {{ units_remaining_this_hour + (ns.index * 4) }}
          {% else %}
            0
          {% endif %}

        current price unit: >
          {{ (now().hour * 4) + (now().minute // 15) }}

        negative price plan: >
          {% set prev = this.attributes.get('negative price plan') or {'active': false} %}
          {% set cur = this.attributes['current price unit'] | int(0) %}
          {% if prev.active and cur < prev.charge_end_unit %}
            {{ prev }}
          {% else %}
            {% set prices = this.attributes['all_price'] or [] %}
            {% set threshold = this.attributes['negative price threshold'] | float(-0.20) %}
            {% set forecast = this.attributes['battery forecast'] or [] %}
            {% set upper_limit = 33 %}
            {% set ns = namespace(found=false, start=0) %}
            {% for i in range(cur, prices | length) %}
              {% if not ns.found and prices[i] < threshold %}
                {% set ns.found = true %}
                {% set ns.start = i %}
              {% endif %}
            {% endfor %}
            {% if not ns.found %}
              {{ {'active': false} }}
            {% else %}
              {% set fwd_ns = namespace(i=ns.start) %}
              {% for _ in range(0, 96) %}
                {% if (fwd_ns.i + 1) < (prices | length) and prices[fwd_ns.i + 1] < threshold %}
                  {% set fwd_ns.i = fwd_ns.i + 1 %}
                {% endif %}
              {% endfor %}
              {% set charge_start = ns.start %}
              {% set charge_end = fwd_ns.i + 1 %}
              {% set units = charge_end - charge_start %}

              {# Maximize energy bought during the negative-price window using the higher charge rate the
                 automation will eventually apply for this event. #}
              {% set charge_speed = this.attributes['negative price charge speed'] | float(15) %}
              {% set charge_per_unit = charge_speed / 4 %}
              {% set raw_potential_kwh = (units * charge_per_unit) | round(2) %}

              {# How much headroom exists at charge_start (raw, un-intervened forecast) — if the battery would
                 already be near-full, discharge just enough beforehand to make room for the full potential. #}
              {% set hour0_start_unit_neg = cur - ((now().minute // 15) | int) %}
              {% set hour_index_start = [[((charge_start - cur) // 4), 0] | max, (forecast | length) - 1] | min %}
              {% set level_at_start = forecast[hour_index_start] | float(0) if forecast | length > 0 else 0 %}
              {% set headroom_available = [upper_limit - level_at_start, 0] | max %}
              {% set discharge_needed_kwh = [raw_potential_kwh - headroom_available, 0] | max %}

              {# Cap the pre-discharge by the energy actually sitting in the battery. The discharge can land
                 anywhere in [cur, charge_start) once price-optimized below, so use the lowest forecast level
                 across that whole window as the safe ceiling — otherwise the plan can call for selling energy
                 the battery doesn't have yet, driving the forecast negative. Conservative: a single low dip
                 anywhere in the window restricts the whole discharge, even if the optimizer would land elsewhere. #}
              {% set low_threshold = this.attributes['low threshold kwh'] | float(3) %}
              {% set pre_ns = namespace(vals=[]) %}
              {% for h in range(0, forecast | length) %}
                {% set hs = hour0_start_unit_neg + (h * 4) %}
                {% set he = hs + 4 %}
                {% if he > cur and hs < charge_start %}
                  {% set pre_ns.vals = pre_ns.vals + [forecast[h]] %}
                {% endif %}
              {% endfor %}
              {% set forecast_min_pre = (pre_ns.vals | min) if pre_ns.vals | length > 0 else level_at_start %}
              {% set max_safe_discharge_kwh = [forecast_min_pre - low_threshold, 0] | max %}

              {% set discharge_speed = this.attributes['battery_discharge_speed'] | float(10) %}
              {% set discharge_per_unit = discharge_speed / 4 %}
              {% set discharge_units_needed_raw = [(discharge_needed_kwh / discharge_per_unit) | round(0, 'ceil') | int, 0] | max %}
              {% set available_lead_units = [charge_start - cur, 0] | max %}
              {% set discharge_units_by_energy = [(max_safe_discharge_kwh / discharge_per_unit) | round(0, 'floor') | int, 0] | max %}
              {% set discharge_units = [discharge_units_needed_raw, available_lead_units, discharge_units_by_energy] | min %}
              {% set actual_discharge_kwh = (discharge_units * discharge_per_unit) | round(2) %}
              {% set achievable_headroom = headroom_available + actual_discharge_kwh %}
              {% set achievable_charge_kwh = [raw_potential_kwh, achievable_headroom] | min %}

              {# Price-optimize the pre-discharge: sell during the highest-price window available in the lead
                 time, rather than mechanically right before charge_start. #}
              {% if discharge_units == 0 %}
                {% set discharge_start = cur %}
              {% else %}
                {% set search_end = charge_start - discharge_units %}
                {% if search_end <= cur %}
                  {% set discharge_start = cur %}
                {% else %}
                  {% set sub_ns = namespace(best_start=cur, best_sum=none) %}
                  {% for s in range(cur, search_end + 1) %}
                    {% set window_sum = prices[s : s + discharge_units] | sum %}
                    {% if sub_ns.best_sum is none or window_sum > sub_ns.best_sum %}
                      {% set sub_ns.best_sum = window_sum %}
                      {% set sub_ns.best_start = s %}
                    {% endif %}
                  {% endfor %}
                  {% set discharge_start = sub_ns.best_start %}
                {% endif %}
              {% endif %}
              {% set discharge_end = discharge_start + discharge_units %}

              {# Even after the price-optimized discharge, solar arriving in the gap before charge_start could
                 still refill the battery past the level we need — scan the raw forecast for the first point past
                 the discharge where that would happen, so system_status can call for an active "Solar export"
                 instead of letting it store (Timo's other automation already throttles solar to house-load-only
                 during the negative-price window itself, so this only concerns the lead-in gap, not the charge
                 window). If it never would, the window is zero-length (a no-op). #}
              {% set target_after_discharge = (33 - achievable_charge_kwh) | round(2) %}
              {% set export_ns = namespace(found=false, start_unit=charge_start) %}
              {% for h in range(0, forecast | length) %}
                {% set hr_start = hour0_start_unit_neg + (h * 4) %}
                {% set hr_end = hr_start + 4 %}
                {% if not export_ns.found and hr_start >= discharge_end and hr_end <= charge_start and forecast[h] > target_after_discharge %}
                  {% set export_ns.found = true %}
                  {% set export_ns.start_unit = hr_start %}
                {% endif %}
              {% endfor %}
              {% set solar_export_start = export_ns.start_unit if export_ns.found else charge_start %}
              {% set solar_export_end = charge_start %}

              {{ {
                'active': true,
                'threshold': threshold,
                'charge_start_unit': charge_start,
                'charge_end_unit': charge_end,
                'charge_units': units,
                'raw_potential_kwh': raw_potential_kwh,
                'achievable_charge_kwh': achievable_charge_kwh | round(2),
                'level_at_start_kwh': level_at_start | round(2),
                'headroom_available_kwh': headroom_available | round(2),
                'target_after_discharge_kwh': target_after_discharge,
                'discharge_needed_kwh': actual_discharge_kwh,
                'capped_by_energy_limit': discharge_units_by_energy < discharge_units_needed_raw,
                'discharge_start_unit': discharge_start,
                'discharge_end_unit': discharge_end,
                'solar_export_start_unit': solar_export_start,
                'solar_export_end_unit': solar_export_end,
                'effective_charge_per_unit': charge_per_unit | round(4),
                'effective_discharge_per_unit': discharge_per_unit | round(4)
              } }}
            {% endif %}
          {% endif %}

        battery forecast with negative price: >
          {% set raw = this.attributes['battery forecast'] or [] %}
          {% set neg = this.attributes.get('negative price plan') or {'active': false} %}
          {% if not neg.active %}
            {{ raw }}
          {% else %}
            {% set cur = this.attributes['current price unit'] | int(0) %}
            {% set current_unit_in_hour = (now().minute // 15) | int %}
            {% set hour0_start_unit = cur - current_unit_in_hour %}
            {% set cap = 33 - 0.01 %}
            {# Four phases: untouched, until the price-optimized discharge begins → discharging, progressively →
               held flat at target_after_discharge (an active "Solar export" clamp — solar arriving in this gap
               would otherwise refill past what the charge window needs, so it's exported instead of stored,
               never letting the level exceed the target) → charging, sourced purely from the grid action itself
               rather than raw's solar-based trajectory (solar is throttled to house-load-only during the actual
               negative-price window by Timo's other automation, so it contributes nothing here) → after charge
               ends, shift and continue raw's natural shape from wherever the charge left it. #}
            {% set ns = namespace(values=[], discharge_delta=0, shift=none) %}
            {% for h in range(0, raw | length) %}
              {% set hour_start_unit = hour0_start_unit + (h * 4) %}
              {% set hour_end_unit = hour_start_unit + 4 %}
              {% if hour_end_unit <= neg.discharge_start_unit %}
                {% set ns.values = ns.values + [raw[h] | round(2)] %}
              {% elif hour_start_unit < neg.discharge_end_unit %}
                {% set overlap = ([hour_end_unit, neg.discharge_end_unit] | min) - ([hour_start_unit, neg.discharge_start_unit] | max) %}
                {% set overlap = [overlap, 0] | max %}
                {% set ns.discharge_delta = ns.discharge_delta - (overlap * neg.effective_discharge_per_unit) %}
                {% set ns.values = ns.values + [(raw[h] + ns.discharge_delta) | round(2)] %}
              {% elif hour_end_unit <= neg.charge_start_unit %}
                {% set ns.values = ns.values + [([raw[h] + ns.discharge_delta, neg.target_after_discharge_kwh] | min) | round(2)] %}
              {% elif hour_start_unit < neg.charge_end_unit %}
                {% set charge_overlap = ([hour_end_unit, neg.charge_end_unit] | min) - ([hour_start_unit, neg.charge_start_unit] | max) %}
                {% set charge_overlap = [charge_overlap, 0] | max %}
                {% set level_before = ns.values[-1] if ns.values | length > 0 else neg.target_after_discharge_kwh %}
                {% set ns.values = ns.values + [([level_before + (charge_overlap * neg.effective_charge_per_unit), cap] | min) | round(2)] %}
              {% elif ns.shift is none %}
                {% set level_before = ns.values[-1] if ns.values | length > 0 else neg.target_after_discharge_kwh %}
                {% set ns.shift = raw[h] - level_before %}
                {% set ns.values = ns.values + [(raw[h] - ns.shift) | round(2)] %}
              {% else %}
                {% set ns.values = ns.values + [(raw[h] - ns.shift) | round(2)] %}
              {% endif %}
            {% endfor %}
            {{ ns.values }}
          {% endif %}

        spike plan: >
          {% set prev = this.attributes.get('spike plan') or {'active': false} %}
          {% set cur = this.attributes['current price unit'] | int(0) %}
          {% if prev.active and cur >= prev.charge_start_unit and cur < prev.discharge_end_unit %}
            {{ prev }}
          {% else %}
            {% set prices = this.attributes['all_price'] or [] %}
            {% set forecast = this.attributes['battery forecast'] or [] %}
            {% set usage = this.attributes['energy usage 120 hrs'] or [] %}
            {% set low_threshold = this.attributes['low threshold kwh'] | float(3) %}
            {% set upper_limit = 30 %}
            {% set high_threshold = 33 %}
            {% set spike_margin = 0.40 %}

            {# negative price plan's own window is always the day's cheapest possible price by construction —
               left in scope, spike would either mistake it for its own cheap point (colliding with negative price
               plan's higher-priority action) or, worse, have its low-before-high day-min/max detection broken
               outright whenever the negative event falls after the real peak. Excluded from both the day-min/max
               scan below and the charge-window search further down. #}
            {% set neg = this.attributes.get('negative price plan') or {'active': false} %}
            {% set neg_excl_start = neg.charge_start_unit if neg.active else -1 %}
            {% set neg_excl_end = neg.charge_end_unit if neg.active else -1 %}
            {% set high_sentinel = 999 %}
            {% set mask_ns = namespace(values=[]) %}
            {% for i in range(0, prices | length) %}
              {% if neg.active and i >= neg_excl_start and i < neg_excl_end %}
                {% set mask_ns.values = mask_ns.values + [high_sentinel] %}
              {% else %}
                {% set mask_ns.values = mask_ns.values + [prices[i]] %}
              {% endif %}
            {% endfor %}
            {% set masked_prices = mask_ns.values %}

            {% set ns = namespace(found=false, day_start=0, low_abs=0, high_abs=0, day_min=0, day_max=0) %}
            {% for day_start in [0, 96] %}
              {% if not ns.found and (day_start + 96) <= (prices | length) %}
                {% set day_ns = namespace(min=none, max=none, min_idx=day_start, max_idx=day_start) %}
                {% for i in range(day_start, day_start + 96) %}
                  {% if not (neg.active and i >= neg_excl_start and i < neg_excl_end) %}
                    {% if day_ns.min is none or prices[i] < day_ns.min %}
                      {% set day_ns.min = prices[i] %}
                      {% set day_ns.min_idx = i %}
                    {% endif %}
                    {% if day_ns.max is none or prices[i] > day_ns.max %}
                      {% set day_ns.max = prices[i] %}
                      {% set day_ns.max_idx = i %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {% if day_ns.min is not none and (day_ns.max - day_ns.min) > spike_margin %}
                  {% set low_abs = day_ns.min_idx %}
                  {% set high_abs = day_ns.max_idx %}
                  {% if low_abs < high_abs and high_abs > cur %}
                    {% set ns.found = true %}
                    {% set ns.day_start = day_start %}
                    {% set ns.low_abs = low_abs %}
                    {% set ns.high_abs = high_abs %}
                    {% set ns.day_min = day_ns.min %}
                    {% set ns.day_max = day_ns.max %}
                  {% endif %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {% if not ns.found %}
              {{ {'active': false} }}
            {% else %}
              {% set after = prices[ns.high_abs + 1:] %}
              {% set later_min = (after | min) if after | length > 0 else none %}
              {% set recharge_qualifies = later_min is not none and (ns.day_max - later_min) > spike_margin %}
              {% set recharge_unit = ns.high_abs + 1 + after.index(later_min) if recharge_qualifies else ns.high_abs %}

              {% set hour_index_high = [[((ns.high_abs - cur) // 4), 0] | max, (forecast | length) - 1] | min %}
              {% set solar_only_level = forecast[hour_index_high] | float(0) if forecast | length > 0 else 0 %}
              {% if solar_only_level >= high_threshold %}
                {% set charge_target_level = high_threshold - 0.1 %}
              {% else %}
                {% set charge_target_level = upper_limit %}
              {% endif %}
              {% set charge_needed_kwh = [charge_target_level - solar_only_level, 0] | max %}

              {% set charge_per_unit = this.attributes['battery_charge_speed'] | float(7) / 4 %}
              {% set hour_index_low = [[((ns.low_abs - cur) // 4), 0] | max, (usage | length) - 1] | min %}
              {% set relevant_usage = usage[0:hour_index_low + 1] %}
              {% set avg_usage_kwh = (relevant_usage | sum / (relevant_usage | length)) if relevant_usage | length > 0 else 0 %}
              {% set avg_usage_per_unit = avg_usage_kwh / 4 %}
              {% set effective_charge_per_unit = [charge_per_unit - avg_usage_per_unit, 0.1] | max %}
              {% set charge_units_needed = [(charge_needed_kwh / effective_charge_per_unit) | round(0, 'ceil') | int, 0] | max %}

              {% if charge_units_needed == 0 %}
                {% set charge_start = cur %}
                {% set charge_end = cur %}
              {% else %}
                {% set search_end = ns.high_abs %}
                {% set window_len = search_end - cur %}
                {% if window_len <= charge_units_needed %}
                  {% set charge_start = cur %}
                {% else %}
                  {# masked_prices (not prices) so this search can't land on top of negative price plan's own
                     claimed charge window even after the day-min/max exclusion above. #}
                  {% set sub_ns = namespace(best_start=cur, best_sum=none) %}
                  {% for s in range(cur, search_end - charge_units_needed + 1) %}
                    {% set window_sum = masked_prices[s : s + charge_units_needed] | sum %}
                    {% if sub_ns.best_sum is none or window_sum < sub_ns.best_sum %}
                      {% set sub_ns.best_sum = window_sum %}
                      {% set sub_ns.best_start = s %}
                    {% endif %}
                  {% endfor %}
                  {% set charge_start = sub_ns.best_start %}
                {% endif %}
                {% set charge_end = charge_start + charge_units_needed %}
              {% endif %}

              {# The automation now applies the higher spike-discharge rate (matching the automation's -15 kW
                 setpoint on the "Start spike discharge" main event) to this window, not the normal
                 battery_discharge_speed — size against the rate that will actually be commanded. #}
              {% set discharge_per_unit = this.attributes['spike discharge speed'] | float(15) / 4 %}
              {% set relevant_usage_d = usage[0:hour_index_high + 1] %}
              {% set avg_usage_kwh_d = (relevant_usage_d | sum / (relevant_usage_d | length)) if relevant_usage_d | length > 0 else 0 %}
              {% set avg_usage_per_unit_d = avg_usage_kwh_d / 4 %}
              {% set effective_discharge_per_unit = discharge_per_unit + avg_usage_per_unit_d %}

              {# max_safe_surplus caps against the forecast's own minimum regardless of branch — if the assumed
                 recharge never actually happens (solar undershoots, usage spikes), discharging past this would
                 drive the battery below low_threshold before anything replenishes it. #}
              {% set forecast_min = (forecast | min) if forecast | length > 0 else low_threshold %}
              {% set max_safe_surplus = [forecast_min - low_threshold, 0] | max %}
              {% set aggressive_target_kwh = [charge_target_level - low_threshold, 0] | max %}
              {% if recharge_qualifies %}
                {% set hour_index_recharge = [[((recharge_unit - cur) // 4), hour_index_high] | max, (forecast | length) - 1] | min %}
                {% set natural_decline_to_recharge = [solar_only_level - (forecast[hour_index_recharge] | float(0)), 0] | max %}
                {% set raw_desired_discharge_kwh = [aggressive_target_kwh - natural_decline_to_recharge, 0] | max %}
              {% else %}
                {% set raw_desired_discharge_kwh = aggressive_target_kwh %}
              {% endif %}
              {% set desired_discharge_kwh = [raw_desired_discharge_kwh, max_safe_surplus] | min %}
              {% set capped_by_energy_limit = desired_discharge_kwh < raw_desired_discharge_kwh %}

              {% set desired_units = [(desired_discharge_kwh / effective_discharge_per_unit) | round(0, 'ceil') | int, 1] | max %}

              {# Only genuinely high-priced units get sold into: cap the window to the contiguous run around the peak
                 whose price clears (day_min rounded down to the cent) + spike_margin. Without this, discharge_units_needed
                 alone would push the tail of the window into mediocre prices just to hit the energy target. #}
              {% set discharge_price_floor = (((ns.day_min * 100) | int) / 100) + spike_margin %}
              {% set day_end = ns.day_start + 96 %}
              {% set back_ns = namespace(i=ns.high_abs) %}
              {% for _ in range(0, 96) %}
                {% if back_ns.i > ns.day_start and prices[back_ns.i - 1] >= discharge_price_floor %}
                  {% set back_ns.i = back_ns.i - 1 %}
                {% endif %}
              {% endfor %}
              {% set run_start = back_ns.i %}
              {% set fwd_ns = namespace(i=ns.high_abs) %}
              {% for _ in range(0, 96) %}
                {% if (fwd_ns.i + 1) < day_end and prices[fwd_ns.i + 1] >= discharge_price_floor %}
                  {% set fwd_ns.i = fwd_ns.i + 1 %}
                {% endif %}
              {% endfor %}
              {% set run_end_inclusive = fwd_ns.i %}
              {% set run_max_units = run_end_inclusive - run_start + 1 %}

              {% set discharge_units_needed = [desired_units, run_max_units] | min %}
              {% set discharge_capped_by_price = discharge_units_needed < desired_units %}

              {% if discharge_units_needed >= run_max_units %}
                {% set discharge_start = run_start %}
              {% else %}
                {% set sub_ns2 = namespace(best_start=ns.high_abs, best_sum=none) %}
                {% for s in range(run_start, run_end_inclusive - discharge_units_needed + 2) %}
                  {% set window_sum = prices[s : s + discharge_units_needed] | sum %}
                  {% if sub_ns2.best_sum is none or window_sum > sub_ns2.best_sum %}
                    {% set sub_ns2.best_sum = window_sum %}
                    {% set sub_ns2.best_start = s %}
                  {% endif %}
                {% endfor %}
                {% set discharge_start = sub_ns2.best_start %}
              {% endif %}
              {% set discharge_end = discharge_start + discharge_units_needed %}
              {% set discharge_target_kwh = (discharge_units_needed * effective_discharge_per_unit) | round(2) %}

              {{ {
                'active': true,
                'day_start': ns.day_start,
                'low_price_unit': ns.low_abs,
                'high_price_unit': ns.high_abs,
                'day_min_price': ns.day_min,
                'day_max_price': ns.day_max,
                'recharge_qualifies': recharge_qualifies,
                'recharge_unit': recharge_unit,
                'charge_target_level_kwh': charge_target_level | round(2),
                'charge_needed_kwh': charge_needed_kwh | round(2),
                'charge_start_unit': charge_start,
                'charge_end_unit': charge_end,
                'discharge_target_kwh': discharge_target_kwh | round(2),
                'discharge_desired_kwh': desired_discharge_kwh | round(2),
                'capped_by_energy_limit': capped_by_energy_limit,
                'discharge_price_floor': discharge_price_floor | round(3),
                'discharge_capped_by_price': discharge_capped_by_price,
                'discharge_start_unit': discharge_start,
                'discharge_end_unit': discharge_end,
                'effective_charge_per_unit': effective_charge_per_unit | round(4),
                'effective_discharge_per_unit': effective_discharge_per_unit | round(4)
              } }}
            {% endif %}
          {% endif %}

        battery forecast with spike: >
          {% set raw = this.attributes['battery forecast with negative price'] or [] %}
          {% set spike = this.attributes.get('spike plan') or {'active': false} %}
          {% if not spike.active %}
            {{ raw }}
          {% else %}
            {% set cur = this.attributes['current price unit'] | int(0) %}
            {% set current_unit_in_hour = (now().minute // 15) | int %}
            {% set hour0_start_unit = cur - current_unit_in_hour %}
            {% set cap = 33 - 0.01 %}
            {% set post_discharge_level = spike.charge_target_level_kwh - spike.discharge_target_kwh %}
            {% set ns = namespace(values=[], shift=none, charge_delta=0) %}
            {% for h in range(0, raw | length) %}
              {% set hour_start_unit = hour0_start_unit + (h * 4) %}
              {% set hour_end_unit = hour_start_unit + 4 %}
              {% if hour_end_unit <= spike.discharge_start_unit %}
                {% set charge_overlap = ([hour_end_unit, spike.charge_end_unit] | min) - ([hour_start_unit, spike.charge_start_unit] | max) %}
                {% set charge_overlap = [charge_overlap, 0] | max %}
                {% set ns.charge_delta = ns.charge_delta + (charge_overlap * spike.effective_charge_per_unit) %}
                {% set ns.values = ns.values + [([raw[h] + ns.charge_delta, cap] | min) | round(2)] %}
              {% elif ns.shift is none %}
                {% set ns.shift = raw[h] - post_discharge_level %}
                {% set ns.values = ns.values + [(raw[h] - ns.shift) | round(2)] %}
              {% else %}
                {% set ns.values = ns.values + [(raw[h] - ns.shift) | round(2)] %}
              {% endif %}
            {% endfor %}
            {{ ns.values }}
          {% endif %}

        low charge plan: >
          {% set prev = this.attributes.get('low charge plan') or {'active': false} %}
          {% set cur = this.attributes['current price unit'] | int(0) %}
          {% if prev.active and cur >= prev.start_unit and cur < prev.end_unit %}
            {{ prev }}
          {% else %}
            {# Truncated to the planning horizon (72h default) so breach detection ignores the tail of the now-120h forecast (2026-09-11) #}
            {% set planning_horizon = this.attributes['planning horizon hours'] | int(72) %}
            {% set forecast = (this.attributes['battery forecast with spike'] or [])[0 : planning_horizon + 1] %}
            {% set charge_per_unit = this.attributes['battery_charge_speed'] | float(7) / 4 %}
            {% set low_threshold = this.attributes['low threshold kwh'] | float(3) %}
            {% set min_charge_target = this.attributes['minimum charge target kwh'] | float(5) %}
            {% set upper_limit = 30 %}
            {% set ns = namespace(found=false, hour_index=0, value=0) %}
            {% for h in range(0, forecast | length) %}
              {% if not ns.found and forecast[h] < low_threshold %}
                {% set ns.found = true %}
                {% set ns.hour_index = h %}
                {% set ns.value = forecast[h] %}
              {% endif %}
            {% endfor %}
            {% if not ns.found %}
              {{ {'active': false, 'breach_unit': 999999} }}
            {% else %}
              {% set current_unit_in_hour = (now().minute // 15) | int %}
              {% set units_to_next_hour = 4 - current_unit_in_hour %}
              {% set breach_offset_units = units_to_next_hour + (ns.hour_index * 4) %}
              {% set current_abs_unit = this.attributes['current price unit'] | int(0) %}
              {% set breach_unit = current_abs_unit + breach_offset_units %}
              {% set target_level = [low_threshold, min_charge_target] | max %}
              {% set deficit = (target_level - ns.value) | round(3) %}
              {% set future_peak = (forecast | max) if forecast | length > 0 else upper_limit %}
              {% set headroom = upper_limit - future_peak %}
              {% set target_kwh = [deficit, headroom] | max %}
              {% set usage = this.attributes['energy usage 120 hrs'] or [] %}
              {% set relevant_usage = usage[0:ns.hour_index + 1] %}
              {% set avg_usage_kwh = (relevant_usage | sum / (relevant_usage | length)) if relevant_usage | length > 0 else 0 %}
              {% set avg_usage_per_unit = avg_usage_kwh / 4 %}
              {% set effective_charge_per_unit = [charge_per_unit - avg_usage_per_unit, 0.1] | max %}
              {% set units_needed = [(target_kwh / effective_charge_per_unit) | round(0, 'ceil') | int, 1] | max %}
              {% set prices = this.attributes['all_price'] or [] %}
              {% set search_end = [breach_unit, prices | length] | min %}
              {% set window_len = search_end - current_abs_unit %}
              {% if window_len <= units_needed %}
                {% set best_start = current_abs_unit %}
              {% else %}
                {% set sub_ns = namespace(best_start=current_abs_unit, best_sum=none) %}
                {% for s in range(current_abs_unit, search_end - units_needed + 1) %}
                  {% set window_sum = prices[s : s + units_needed] | sum %}
                  {% if sub_ns.best_sum is none or window_sum < sub_ns.best_sum %}
                    {% set sub_ns.best_sum = window_sum %}
                    {% set sub_ns.best_start = s %}
                  {% endif %}
                {% endfor %}
                {% set best_start = sub_ns.best_start %}
              {% endif %}
              {{ {'active': true, 'deficit_kwh': deficit, 'target_kwh': target_kwh, 'avg_home_load_kw': avg_usage_kwh | round(3), 'effective_charge_per_unit': effective_charge_per_unit | round(4), 'units_needed': units_needed, 'breach_unit': breach_unit, 'start_unit': best_start, 'end_unit': best_start + units_needed} }}
            {% endif %}
          {% endif %}

        high discharge plan: >
          {% set prev = this.attributes.get('high discharge plan') or {'active': false} %}
          {% set cur = this.attributes['current price unit'] | int(0) %}
          {% if prev.active and cur >= prev.start_unit and cur < prev.end_unit %}
            {{ prev }}
          {% else %}
            {# Truncated to the planning horizon (72h default) so breach detection ignores the tail of the now-120h forecast (2026-09-11) #}
            {% set planning_horizon = this.attributes['planning horizon hours'] | int(72) %}
            {% set forecast = (this.attributes['battery forecast with spike'] or [])[0 : planning_horizon + 1] %}
            {% set discharge_per_unit = this.attributes['battery_discharge_speed'] | float(10) / 4 %}
            {% set high_threshold = 33 %}
            {% set low_threshold = this.attributes['low threshold kwh'] | float(3) %}
            {% set ns = namespace(found=false, hour_index=0, value=0) %}
            {% for h in range(0, forecast | length) %}
              {% if not ns.found and forecast[h] > high_threshold %}
                {% set ns.found = true %}
                {% set ns.hour_index = h %}
                {% set ns.value = forecast[h] %}
              {% endif %}
            {% endfor %}
            {% if not ns.found %}
              {{ {'active': false, 'breach_unit': 999999} }}
            {% else %}
              {% set current_unit_in_hour = (now().minute // 15) | int %}
              {% set units_to_next_hour = 4 - current_unit_in_hour %}
              {% set breach_offset_units = units_to_next_hour + (ns.hour_index * 4) %}
              {% set current_abs_unit = this.attributes['current price unit'] | int(0) %}
              {% set breach_unit = current_abs_unit + breach_offset_units %}
              {% set future_peak = (forecast | max) if forecast | length > 0 else high_threshold %}
              {% set raw_surplus = (future_peak - high_threshold) | round(3) %}
              {% set forecast_min = (forecast | min) if forecast | length > 0 else low_threshold %}
              {% set max_safe_surplus = (forecast_min - low_threshold) | round(3) %}
              {% set surplus = [[raw_surplus, max_safe_surplus] | min, 0] | max %}
              {% if surplus <= 0 %}
                {{ {'active': false, 'breach_unit': 999999} }}
              {% else %}
                {% set usage = this.attributes['energy usage 120 hrs'] or [] %}
                {% set relevant_usage = usage[0:ns.hour_index + 1] %}
                {% set avg_usage_kwh = (relevant_usage | sum / (relevant_usage | length)) if relevant_usage | length > 0 else 0 %}
                {% set avg_usage_per_unit = avg_usage_kwh / 4 %}
                {% set effective_discharge_per_unit = discharge_per_unit + avg_usage_per_unit %}
                {% set units_needed = [(surplus / effective_discharge_per_unit) | round(0, 'ceil') | int, 1] | max %}
                {% set prices = this.attributes['all_price'] or [] %}
                {% set search_end = [breach_unit, prices | length] | min %}
                {% set window_len = search_end - current_abs_unit %}
                {% if window_len <= units_needed %}
                  {% set best_start = current_abs_unit %}
                {% else %}
                  {% set sub_ns = namespace(best_start=current_abs_unit, best_sum=none) %}
                  {% for s in range(current_abs_unit, search_end - units_needed + 1) %}
                    {% set window_sum = prices[s : s + units_needed] | sum %}
                    {% if sub_ns.best_sum is none or window_sum < sub_ns.best_sum %}
                      {% set sub_ns.best_sum = window_sum %}
                      {% set sub_ns.best_start = s %}
                    {% endif %}
                  {% endfor %}
                  {% set best_start = sub_ns.best_start %}
                {% endif %}
                {{ {'active': true, 'surplus_kwh': surplus, 'target_kwh': surplus, 'avg_home_load_kw': avg_usage_kwh | round(3), 'effective_discharge_per_unit': effective_discharge_per_unit | round(4), 'capped_by_low_limit': surplus < raw_surplus, 'breach_unit': breach_unit, 'start_unit': best_start, 'end_unit': best_start + units_needed, 'units_needed': units_needed} }}
              {% endif %}
            {% endif %}
          {% endif %}

        battery forecast adjusted: >
          {% set base = this.attributes['battery forecast with spike'] or [] %}
          {% set low = this.attributes.get('low charge plan') or {'active': false} %}
          {% set high = this.attributes.get('high discharge plan') or {'active': false} %}
          {% set charge_rate = low.effective_charge_per_unit if low.active else 0 %}
          {% set discharge_rate = high.effective_discharge_per_unit if high.active else 0 %}
          {% set current_abs_unit = this.attributes['current price unit'] | int(0) %}
          {% set current_unit_in_hour = (now().minute // 15) | int %}
          {% set hour0_start_unit = current_abs_unit - current_unit_in_hour %}
          {% set low_start = low.start_unit if low.active else 0 %}
          {% set low_end = low.end_unit if low.active else 0 %}
          {% set high_start = high.start_unit if high.active else 0 %}
          {% set high_end = high.end_unit if high.active else 0 %}
          {% set ns = namespace(values=[], delta=0) %}
          {% for h in range(0, base | length) %}
            {% set hour_start = hour0_start_unit + (h * 4) %}
            {% set hour_end = hour_start + 4 %}
            {% set charge_overlap = ([hour_end, low_end] | min) - ([hour_start, low_start] | max) %}
            {% set charge_overlap = [charge_overlap, 0] | max %}
            {% set discharge_overlap = ([hour_end, high_end] | min) - ([hour_start, high_start] | max) %}
            {% set discharge_overlap = [discharge_overlap, 0] | max %}
            {% set ns.delta = ns.delta + (charge_overlap * charge_rate) - (discharge_overlap * discharge_rate) %}
            {% set ns.values = ns.values + [(base[h] | float(0) + ns.delta) | round(2)] %}
          {% endfor %}
          {{ ns.values }}


        full charge plan: >
          {% set prev = this.attributes.get('full charge plan') or {'active': false, 'phase': none} %}
          {% set cur = this.attributes['current price unit'] | int(0) %}
          {% set interval_days = this.attributes['full charge interval days'] | float(14) %}
          {% set time_since_days = this.attributes['time since full charge days'] | float(0) %}
          {% set soc_now = states('sensor.victron_shunt_state_of_charge') | float(0) %}
          {% set is_full = soc_now >= 99.5 %}
          {% set max_hold_minutes = this.attributes['full charge max hold minutes'] | float(120) %}
          {% set voltage_diff = states('sensor.victron_jk_bms_voltage_differential') | float(999) %}
          {% set balance_threshold = 10 %}
          {% if prev.active and prev.phase == 'holding' %}
            {% set hold_start = as_datetime(prev.hold_start) %}
            {% set hold_minutes = ((now() - hold_start).total_seconds() / 60) | round(1) %}
            {% if is_full and voltage_diff < balance_threshold %}
              {{ {'active': false, 'phase': none} }}
            {% elif hold_minutes >= max_hold_minutes %}
              {{ {'active': false, 'phase': none, 'timed_out': true} }}
            {% else %}
              {{ {'active': true, 'phase': 'holding', 'hold_start': prev.hold_start, 'hold_minutes': hold_minutes} }}
            {% endif %}
          {% elif prev.active and prev.phase == 'charging' %}
            {% if is_full %}
              {{ {'active': true, 'phase': 'holding', 'hold_start': now().isoformat()} }}
            {% else %}
              {{ prev }}
            {% endif %}
          {% elif prev.active and prev.phase == 'scheduled' and cur >= prev.start_unit and cur < prev.end_unit %}
            {{ {'active': true, 'phase': 'charging', 'target_kwh': prev.target_kwh, 'deficit_kwh': prev.deficit_kwh, 'hold_hour_usage_kwh': prev.hold_hour_usage_kwh, 'effective_charge_per_unit': prev.effective_charge_per_unit, 'units_needed': prev.units_needed, 'start_unit': prev.start_unit, 'end_unit': prev.end_unit} }}
          {% else %}
            {% set due = time_since_days >= interval_days %}
            {% if not due %}
              {{ {'active': false, 'phase': none} }}
            {% elif is_full %}
              {{ {'active': true, 'phase': 'holding', 'hold_start': now().isoformat()} }}
            {% else %}
              {% set battery_now = this.attributes['battery energy'] | float(0) %}
              {% set upper_limit = 30 %}
              {% set deficit = (upper_limit - battery_now) | round(3) %}
              {% set usage = this.attributes['energy usage 120 hrs'] or [] %}
              {% set hold_hour_usage = usage[0] | float(0) if usage | length > 0 else 0 %}
              {% set target_kwh = (deficit + hold_hour_usage) | round(3) %}
              {% set charge_per_unit = this.attributes['battery_charge_speed'] | float(7) / 4 %}
              {% set avg_usage_per_unit = hold_hour_usage / 4 %}
              {% set effective_charge_per_unit = [charge_per_unit - avg_usage_per_unit, 0.1] | max %}
              {% set units_needed = [(target_kwh / effective_charge_per_unit) | round(0, 'ceil') | int, 1] | max %}
              {% set prices = this.attributes['all_price'] or [] %}
              {% set search_end = prices | length %}
              {% set window_len = search_end - cur %}
              {% if window_len <= units_needed %}
                {% set best_start = cur %}
              {% else %}
                {% set sub_ns = namespace(best_start=cur, best_sum=none) %}
                {% for s in range(cur, search_end - units_needed + 1) %}
                  {% set window_sum = prices[s : s + units_needed] | sum %}
                  {% if sub_ns.best_sum is none or window_sum < sub_ns.best_sum %}
                    {% set sub_ns.best_sum = window_sum %}
                    {% set sub_ns.best_start = s %}
                  {% endif %}
                {% endfor %}
                {% set best_start = sub_ns.best_start %}
              {% endif %}
              {{ {'active': true, 'phase': 'scheduled', 'target_kwh': target_kwh, 'deficit_kwh': deficit, 'hold_hour_usage_kwh': hold_hour_usage | round(3), 'effective_charge_per_unit': effective_charge_per_unit | round(4), 'units_needed': units_needed, 'start_unit': best_start, 'end_unit': best_start + units_needed} }}
            {% endif %}
          {% endif %}

        system_status: >
          {% set setpoint = states('sensor.victron_cerbo_gx_grid_setpoint') | float(0) %}
          {% set idle_setpoint = -30 %}
          {% set is_idle = (setpoint - idle_setpoint) | abs < 50 %}
          {% set cur = this.attributes['current price unit'] | int(0) %}
          {% set full = this.attributes.get('full charge plan') or {'active': false, 'phase': none} %}
          {% set neg = this.attributes.get('negative price plan') or {'active': false} %}
          {% set spike = this.attributes.get('spike plan') or {'active': false} %}
          {% set low = this.attributes.get('low charge plan') or {'active': false, 'breach_unit': 999999} %}
          {% set high = this.attributes.get('high discharge plan') or {'active': false, 'breach_unit': 999999} %}
          {% set battery_now = this.attributes['battery energy'] | float(0) %}
          {% set low_threshold = this.attributes['low threshold kwh'] | float(3) %}
          {% set near_low_limit = (battery_now - low_threshold) <= 1 %}
          {% set charge_engaged_at = this.attributes['battery_charge_speed'] | float(7) * 1000 * 0.5 %}
          {% set discharge_engaged_at = this.attributes['battery_discharge_speed'] | float(10) * 1000 * 0.5 %}
          {% set prices = this.attributes['all_price'] or [] %}
          {% set price_now = prices[cur] | float(0) if cur < prices | length else 0 %}
          {% set price_at_breach = prices[high.breach_unit] | float(0) if high.active and high.breach_unit < prices | length else 0 %}
          {% set same_day_breach = high.active and high.breach_unit < 96 %}
          {% set export_favorable = high.active and price_now > price_at_breach %}
          {% if full.active and full.phase in ['charging', 'holding'] %}
            {% if full.phase == 'charging' %}
              {% if setpoint >= charge_engaged_at %}
                Actief
              {% else %}
                Start charge
              {% endif %}
            {% else %}
              {% if setpoint >= charge_engaged_at %}
                Balancing
              {% else %}
                Start charge
              {% endif %}
            {% endif %}
          {% elif neg.active and cur < neg.charge_end_unit %}
            {% if cur >= neg.charge_start_unit and cur < neg.charge_end_unit %}
              {# Main event — the actual paid-to-charge window — gets its own start/engaged trigger pair,
                 distinct from a normal charge, so the automation can key off it for the higher setpoint. #}
              {% if setpoint >= charge_engaged_at %}
                Negative price charge
              {% else %}
                Start negative price charge
              {% endif %}
            {% elif cur >= neg.discharge_start_unit and cur < neg.discharge_end_unit %}
              {# Pre-discharge to make room — not the main event — reuses the normal discharge trigger. #}
              {% if setpoint <= -discharge_engaged_at %}
                Actief
              {% else %}
                Start discharge
              {% endif %}
            {% elif cur >= neg.solar_export_start_unit and cur < neg.solar_export_end_unit %}
              Solar export
            {% else %}
              Standby
            {% endif %}
          {% elif spike.active and cur < spike.discharge_end_unit %}
            {% if cur >= spike.charge_start_unit and cur < spike.charge_end_unit %}
              {# Pre-charge before the spike — not the main event — reuses the normal charge trigger. #}
              {% if setpoint >= charge_engaged_at %}
                Actief
              {% else %}
                Start charge
              {% endif %}
            {% elif cur >= spike.discharge_start_unit %}
              {# Main event — selling into the price spike — gets its own start/engaged trigger pair,
                 distinct from a normal discharge, so the automation can key off it for the higher setpoint. #}
              {% if setpoint <= -discharge_engaged_at %}
                Spike discharge
              {% else %}
                Start spike discharge
              {% endif %}
            {% else %}
              Standby
            {% endif %}
          {% elif low.active and (not high.active or low.breach_unit <= high.breach_unit) %}
            {% if cur >= low.start_unit and cur < low.end_unit %}
              {% if setpoint >= charge_engaged_at %}
                Actief
              {% else %}
                Start charge
              {% endif %}
            {% elif cur >= low.end_unit and not is_idle %}
              Stop
            {% elif cur < low.start_unit and near_low_limit %}
              Grid usage
            {% else %}
              Standby
            {% endif %}
          {% elif high.active %}
            {% if cur >= high.start_unit and cur < high.end_unit %}
              {% if setpoint <= -discharge_engaged_at %}
                Actief
              {% else %}
                Start discharge
              {% endif %}
            {% elif cur >= high.end_unit and not is_idle %}
              Stop
            {% elif cur < high.start_unit and near_low_limit and same_day_breach and export_favorable %}
              Solar export
            {% else %}
              Standby
            {% endif %}
          {% else %}
            {% if not is_idle %}
              Stop
            {% else %}
              Standby
            {% endif %}
          {% endif %}

        charge energy kwh: >
          {% set neg = this.attributes['negative price plan'] %}
          {% set spike = this.attributes['spike plan'] %}
          {% set cur = this.attributes['current price unit'] | int(0) %}
          {% set plan = this.attributes['low charge plan'] %}
          {% if neg and neg.active and cur < neg.charge_end_unit %}
            {{ neg.achievable_charge_kwh | round(2) }} kWh
          {% elif spike and spike.active and cur < spike.discharge_end_unit %}
            {{ spike.charge_needed_kwh | round(2) }} kWh
          {% elif plan and plan.active %}
            {{ plan.target_kwh | round(2) }} kWh
          {% else %}
            -
          {% endif %}

        charge start time: >
          {% set neg = this.attributes['negative price plan'] %}
          {% set spike = this.attributes['spike plan'] %}
          {% set cur = this.attributes['current price unit'] | int(0) %}
          {% set plan = this.attributes['low charge plan'] %}
          {% if neg and neg.active and cur < neg.charge_end_unit %}
            {% set offset_units = neg.charge_start_unit - cur %}
            {{ (now() + timedelta(minutes=offset_units * 15)).strftime('%a %H:%M') }}
          {% elif spike and spike.active and cur < spike.discharge_end_unit %}
            {% set offset_units = spike.charge_start_unit - cur %}
            {{ (now() + timedelta(minutes=offset_units * 15)).strftime('%a %H:%M') }}
          {% elif plan and plan.active %}
            {% set offset_units = plan.start_unit - cur %}
            {{ (now() + timedelta(minutes=offset_units * 15)).strftime('%a %H:%M') }}
          {% else %}
            -
          {% endif %}

        charge stop time: >
          {% set neg = this.attributes['negative price plan'] %}
          {% set spike = this.attributes['spike plan'] %}
          {% set cur = this.attributes['current price unit'] | int(0) %}
          {% set plan = this.attributes['low charge plan'] %}
          {% if neg and neg.active and cur < neg.charge_end_unit %}
            {% set offset_units = neg.charge_end_unit - cur %}
            {{ (now() + timedelta(minutes=offset_units * 15)).strftime('%a %H:%M') }}
