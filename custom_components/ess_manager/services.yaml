ev_session_save:
  fields:
    entity_id:
      example: sensor.ess_manager_status
      selector:
        entity:
          integration: ess_manager
          domain: sensor
    id:
      example: "h:2026-10-13T18"
      selector:
        text:
    start:
      example: "2026-10-13T18:00:00+02:00"
      selector:
        datetime:
    kwh:
      selector:
        number:
          min: 0
          max: 500
          step: 0.1
          unit_of_measurement: kWh
    mode:
      selector:
        select:
          options:
            - fixed
            - solar
            - deadline
    deadline:
      example: "2026-10-14T07:00:00+02:00"
      selector:
        datetime:
    current_a:
      selector:
        number:
          min: 1
          max: 75
          step: 1
          unit_of_measurement: A
    car:
      selector:
        text:
    start_soc:
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    target_soc:
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    enabled:
      selector:
        boolean:
ev_session_remove:
  fields:
    entity_id:
      example: sensor.ess_manager_status
      selector:
        entity:
          integration: ess_manager
          domain: sensor
    id:
      required: true
      example: "m:3f2a9c01b4"
      selector:
        text:
ev_charge_plan:
  fields:
    entity_id:
      example: sensor.ess_manager_status
      selector:
        entity:
          integration: ess_manager
          domain: sensor
    car:
      example: "a1b2c3d4"
      selector:
        text:
    choice:
      required: true
      example: deadline
      selector:
        select:
          options:
            - asap
            - calm
            - deadline
    day:
      example: tomorrow
      selector:
        select:
          options:
            - today
            - tomorrow
            - any
    hour:
      example: "07:00"
      selector:
        text:
    soc:
      example: 40
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    kwh:
      example: 20
      selector:
        number:
          min: 0
          max: 250
          step: 0.1
          unit_of_measurement: kWh
